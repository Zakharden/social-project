<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>

        /* Добавленные стили для кнопки "На главную" */
        .back-button {
            display: inline-block;
            padding: 10px 20px;
            color: rgb(255, 224, 130);
            text-decoration: none;
            border-radius: 24px;
            margin-bottom: 30px;
            transition: background 0.3s ease;
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .back-button:hover {
        background: rgba(0, 0, 0, 0.05);
        color:  #FFE082; 
    }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='registration.jpg') }}") center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            margin: 20px;
        }

        h2 {
            color: #424242;
            font-size: 2.5em;
            font-weight: 500;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .photo-upload {
            border: 2px dashed #616161;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-upload:hover {
            border-color: #FFF3B0;
            background: rgba(255, 243, 176, 0.1);
        }

        .form-label {
            font-weight: 500;
            color: #616161;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 16px;
            border: 1px solid #BDBDBD;
        }

        .btn-primary {
            background-color: #FFF3B0;
            border: none;
            color: #424242;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #FFE082;
            color: #212121;
        }
        /* Стили для ссылки входа */
        .login-link {
            color: #aebf1b;
            text-decoration: none;
            font-weight: 500;
            margin-left: 8px;
            transition: color 0.3s ease;
        }

        .login-link:hover {
            color: #aebf1b;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-button">← На главную</a>

        <h2>Регистрация</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-grid">
                <!-- Персональная информация -->
                <div class="mb-4">
                    <label class="form-label">Имя *</label>
                    <input type="text" class="form-control" name="first_name" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Фамилия *</label>
                    <input type="text" class="form-control" name="last_name" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Дата рождения *</label>
                    <input type="date" class="form-control" name="birth_date" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Основная локация *</label>
                    <input type="text" class="form-control" name="location" required>
                </div>

                <!-- Контакты и фото -->
                <div class="mb-4 full-width">
                    <label class="form-label">Добавить фото</label>
                    <label class="photo-upload">
                        <input type="file" name="photo" accept="image/*" hidden>
                        <span>Нажмите для загрузки фотографии</span>
                    </label>
                </div>

                <!-- Навыки и языки -->
                <div class="mb-4">
                    <label class="form-label">Чему могу научить *</label>
                    <select multiple class="form-select" name="teach_skills" size="4" required>
                        <option>Английский B1</option>
                        <option>Python Basics</option>
                        <option>Digital Marketing</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Чему хочу научиться *</label>
                    <select multiple class="form-select" name="learn_skills" size="4" required>
                        <option>Испанский A1</option>
                        <option>Data Analysis</option>
                        <option>UI/UX Design</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Языки общения *</label>
                    <select multiple class="form-select" name="languages" required>
                        <option>Русский</option>
                        <option>Английский</option>
                        <option>Испанский</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Интересы</label>
                    <select multiple class="form-select" name="interests">
                        <option>Программирование</option>
                        <option>Дизайн</option>
                        <option>Иностранные языки</option>
                    </select>
                </div>

                <!-- Работа и соцсети -->
                <div class="mb-4">
                    <label class="form-label">Место работы</label>
                    <input type="text" class="form-control" name="work_place">
                </div>

                <div class="mb-4">
                    <label class="form-label">Место учебы</label>
                    <input type="text" class="form-control" name="study_place">
                </div>

                <div class="mb-4 full-width">
                    <label class="form-label">Социальные сети</label>
                    <input type="url" class="form-control" name="social_vk" placeholder="ВКонтакте">
                    <input type="url" class="form-control mt-2" name="social_tg" placeholder="Telegram">
                    <input type="url" class="form-control mt-2" name="social_gh" placeholder="GitHub">
                </div>

                <!-- О себе -->
                <div class="mb-4 full-width">
                    <label class="form-label">О себе *</label>
                    <textarea class="form-control" name="about" rows="4" required></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-4">Зарегистрироваться</button>
        </form>
        <div class="text-center mt-3">
            <span class="text-muted">Уже зарегистрированы?</span>
            <a href="/login" class="login-link">Войти</a>
        </div>
    </div>

    <script>
        document.querySelector('input[type="file"]').addEventListener('change', function(e) {
            const label = this.parentElement.querySelector('span');
            label.textContent = this.files[0] ? this.files[0].name : 'Нажмите для загрузки фотографии';
        });
    </script>
</body>
</html>
