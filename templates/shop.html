<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='images/shop.jpg') }}") center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin-top: 40px;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            color: #424242;
            text-decoration: none;
            border-radius: 24px;
            margin-bottom: 30px;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .section {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h2 {
            color: #424242;
            margin-bottom: 25px;
            font-size: 1.8em;
        }

        .merch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .merch-item {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            background: white;
        }

        .merch-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .merch-price {
            color: #FFE082;
            font-weight: 500;
            font-size: 1.2em;
            margin: 15px 0;
        }

        .btn-telegram {
            background: #FFE082;
            color: #616161;
            padding: 12px 30px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
            width: 100%;
            max-width: 200px;
        }

        .btn-telegram:hover {
            background: #0077B5;
        }

        @media (max-width: 768px) {
            .merch-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 15px;
            }
            
            .section {
                padding: 20px;
            }
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <a href="/" class="back-button">← На главную</a>

        <!-- Секция доната -->
        <div class="section">
            <h2>Донаты на развитие проекта</h2>
            <a href="https://t.me/vetka_ecosystem" target="_blank" class="btn-telegram">Поддержать</a>
        </div>

        <!-- Секция мерча -->
        <div class="section">
            <h2>Наш мерч</h2>
            <div class="merch-grid">
                <!-- Товар 1 -->
                <div class="merch-item">
                    <img src="{{ url_for('static', filename='images/t-shirt-1.jpg') }}" class="merch-image">
                    <h3>Футболка</h3>
                    <p class="merch-price">5 500 ₽</p>
                    <a href="https://t.me/vetka_ecosystem" target="_blank" class="btn-telegram">Купить</a>
                </div>

                <!-- Товар 2 -->
                <div class="merch-item">
                    <img src="{{ url_for('static', filename='images/longsliv.jpg') }}" class="merch-image">
                    <h3>Лонгслив</h3>
                    <p class="merch-price">7 500 ₽</p>
                    <a href="https://t.me/vetka_ecosystem" target="_blank" class="btn-telegram">Купить</a>
                </div>

                <!-- Товар 3 -->
                <div class="merch-item">
                    <img src="{{ url_for('static', filename='images/t-shirt-2.jpg') }}" class="merch-image">
                    <h3>Футболка</h3>
                    <p class="merch-price">5 500 ₽</p>
                    <a href="https://t.me/vetka_ecosystem" target="_blank" class="btn-telegram">Купить</a>
                </div>

                <!-- Товар 4 -->
                <div class="merch-item">
                    <img src="{{ url_for('static', filename='images/zipka.jpg') }}" class="merch-image">
                    <h3>Зипка</h3>
                    <p class="merch-price">10 500 ₽</p>
                    <a href="https://t.me/vetka_ecosystem" target="_blank" class="btn-telegram">Купить</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
