<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='images/404.jpg') }}") center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #424242;
            font-size: 3em;
            margin-bottom: 20px;
        }

        p {
            color: #616161;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .back-button {
            display: inline-block;
            padding: 12px 30px;
            background: #616161;
            color: white;
            text-decoration: none;
            border-radius: 24px;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #757575;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Страница не найдена</p>
        <a href="/" class="back-button">← Вернуться на главную</a>
    </div>
</body>
</html>
