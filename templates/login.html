<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Skill Exchange Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* Добавленные стили для кнопки "На главную" */
        .back-button {
            display: inline-block;
            padding: 10px 20px;
            color: #FFE082;
            text-decoration: none;
            border-radius: 24px;
            margin-bottom: 30px;
            transition: background 0.3s ease;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        /* Существующие стили ниже (без изменений) */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='login.jpg') }}") center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: 20px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .form-title {
            color: #424242;
            font-size: 2em;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #616161;
            font-size: 0.9em;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #BDBDBD;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #616161;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #616161;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #757575;
        }

        .forgot-password {
            display: block;
            margin: 15px 0 25px;
            color: #616161;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #424242;
        }

        .register-link {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #EEEEEE;
        }

        .btn-register {
            background: #FFF3B0;
            color: #424242;
            padding: 12px 30px;
            border-radius: 24px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }

        .btn-register:hover {
            background: #FFE082;
        }
    </style>
</head>
<body>
    <a href="/" class="back-button">← На главную</a>
    
    <div class="container">
        <h2 class="form-title">Вход в аккаунт</h2>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="example@gmail.com">
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-login">Войти</button>
            
            <a href="/reset-password" class="forgot-password">Забыли пароль?</a>
        </form>
        
        <div class="register-link">
            <span>Ещё нет аккаунта? </span>
            <a href="/register" class="btn-register">Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
