<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Exchange Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='start-ground.jpg') }}") center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: 20px; 
        }

        .project-name {
            color: #424242;
            font-size: 3em;
            font-weight: 500;
            margin-bottom: 40px;
        }

        .button-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap; 
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #616161;
            color: white;
        }

        .btn-primary:hover {
            background: #757575;
        }

        .btn-main {
            background: #FFF3B0;
            color: #424242;
            padding: 16px 48px;
            font-size: 1.2em;
        }

        .btn-main:hover {
            background: #FFE082;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="project-name">Skill Exchange Platform</h1>
        
        <div class="button-row">
            <a href="/register" class="btn btn-primary">Регистрация</a>
            <a href="/login" class="btn btn-primary">Войти</a>
        </div>
        
        <a href="/search" class="btn btn-main">Поиск партнеров</a>
    </div>
    <a href="/shop" class="btn btn-primary" style="position: fixed; bottom: 20px; right: 20px;">Поддержать проект</a>
</body>
</html>
