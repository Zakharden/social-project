<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title"><i class="fas fa-info-circle me-2"></i>Основная информация</h5>
        <div class="row">
            <div class="col-md-6">
                <p class="mb-2"><i class="fas fa-envelope me-2"></i>{{ user.email }}</p>
                <p class="mb-2"><i class="fas fa-map-marker-alt me-2"></i>{{ user.location }}</p>
            </div>
            <div class="col-md-6">
                <p class="mb-2"><i class="fas fa-birthday-cake me-2"></i>
                    {{ user.birth_date.strftime('%d.%m.%Y') }}
                </p>
                <p class="mb-2"><i class="fas fa-language me-2"></i>
                    {{ user.languages|join(', ') }}
                </p>
            </div>
        </div>
    </div>
</div>
