<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Skill Exchange Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("{{ url_for('static', filename='images/contact.jpg') }}") center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            color: #FFE082;
            text-decoration: none;
            border-radius: 24px;
            margin-bottom: 30px;
            transition: background 0.3s ease;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: 20px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #424242;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .contact-info {
            margin-bottom: 40px;
            text-align: left;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            color: #616161;
        }

        .contact-item i {
            margin-right: 15px;
            color: #FFE082;
            font-size: 1.2em;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #616161;
            font-size: 0.9em;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #BDBDBD;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #616161;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #616161;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #757575;
        }

        .social-links {
            margin-top: 30px;
        }

        .social-link {
            display: inline-block;
            margin: 0 10px;
            color: #616161;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: #FFE082;
        }
    </style>
</head>
<body>
    <a href="/" class="back-button">← На главную</a>
    
    <div class="container">
        <h1>Свяжитесь с нами</h1>
        
        <div class="contact-info">
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <span>support@vetka.com</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-phone"></i>
                <span>+7 (999) 123-45-67</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-map-marker-alt"></i>
                <span>Москва, Россия</span>
            </div>
        </div>

        <form action="/contact" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Тема</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            
            <div class="form-group">
                <label for="message">Сообщение</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Отправить сообщение</button>
        </form>

        <div class="social-links">
            <a href="#" class="social-link"><i class="fab fa-telegram"></i></a>
            <a href="#" class="social-link"><i class="fab fa-vk"></i></a>
            <a href="#" class="social-link"><i class="fab fa-github"></i></a>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js"></script>
</body>
</html>
